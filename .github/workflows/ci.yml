name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
          yamllint .
      - name: Validate the Source of Truth
        run: netauto validate
      # Config changes must show up in the pull request diff. If the SoT or a
      # template changed and the rendered files were not regenerated, fail.
      - name: Rendered files are up to date
        run: netauto render --check
      - name: Tests
        run: pytest -q
