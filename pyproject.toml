[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netauto"
version = "0.1.0"
description = "Source-of-Truth driven network automation lab with validation-first design"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
]

[project.optional-dependencies]
# Only needed when talking to real systems; the offline pipeline
# (validate / render / tests) runs without them.
deploy = ["napalm>=5.0"]
netbox = ["pynetbox>=7.4"]
dev = ["pytest>=8.0", "ruff>=0.6", "yamllint>=1.35"]

[project.scripts]
netauto = "netauto.cli:main"

[tool.setuptools]
packages = ["netauto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["netbox: needs a live NetBox (set NETBOX_URL and NETBOX_TOKEN)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/test_validate.py" = ["E501"]  # the case table reads better one case per line
